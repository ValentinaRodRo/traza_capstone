name: traza_app
description: Traza - Sistema de reportes de seguridad ciudadana para Chía
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.3
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  http: ^1.2.1
  # DI
  get_it: ^7.6.4
  injectable: ^2.3.2
  jwt_decoder: ^2.0.1
  # Navigation
  go_router: ^12.1.1
  
  # Network
  dio: ^5.3.2
  
  flutter_dotenv: ^6.0.1

  # Local Storage
  shared_preferences: ^2.2.1
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  animate_do: ^3.3.2
  
  # Utils
  dartz: ^0.10.1
  uuid: ^4.1.0
  intl: ^0.18.1
  permission_handler: ^11.0.1
  geolocator: ^10.1.0
  
  # Icons
  cupertino_icons: ^1.0.5
  material_design_icons_flutter: ^7.0.7296

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  injectable_generator: ^2.4.1
  mockito: ^5.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/